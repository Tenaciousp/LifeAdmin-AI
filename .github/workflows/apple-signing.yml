name: HomeAdmin manual signed build

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Unused Apple build number (verify in App Store Connect first)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: homeadmin-apple-signing
  cancel-in-progress: false

jobs:
  signed-build:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    environment: apple-signing
    defaults:
      run:
        working-directory: lifeadmin_build/native
    env:
      APPLE_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require successful CI for this exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .conclusion == "success")] | length')
          test "$count" -gt 0 || { echo "This source needs a successful full HomeAdmin CI run."; exit 1; }
          [[ "$APPLE_BUILD_NUMBER" =~ ^[0-9]{1,4}$ ]] && test "$APPLE_BUILD_NUMBER" -gt 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install signing material in a temporary keychain
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_APPSTORE_PROFILE_BASE64: ${{ secrets.APPLE_APPSTORE_PROFILE_BASE64 }}
        run: |
          umask 077
          python -m unittest discover -s ../scripts -p test_apple_signing.py
          python - <<'PY'
          import base64, os
          from pathlib import Path
          for name, filename in [("APPLE_DISTRIBUTION_P12_BASE64", "homeadmin.p12"),
                                 ("APPLE_APPSTORE_PROFILE_BASE64", "homeadmin.mobileprovision")]:
              value = os.environ.get(name, "")
              if not value:
                  raise SystemExit("Missing signing secret: " + name)
              try:
                  data = base64.b64decode("".join(value.split()), validate=True)
              except ValueError:
                  raise SystemExit("Invalid base64 signing secret: " + name) from None
              (Path(os.environ["RUNNER_TEMP"]) / filename).write_bytes(data)
          if not os.environ.get("APPLE_DISTRIBUTION_P12_PASSWORD"):
              raise SystemExit("Missing certificate password secret")
          PY
          # Validate the stored P12 with OpenSSL, then re-export a temporary
          # legacy-encrypted copy for macOS Keychain compatibility. This mirrors
          # the previously verified signing recovery workflow.
          openssl3="$(brew --prefix openssl@3)/bin/openssl"
          "$openssl3" pkcs12 -in "$RUNNER_TEMP/homeadmin.p12" \
            -passin env:APPLE_DISTRIBUTION_P12_PASSWORD -noout
          "$openssl3" pkcs12 -in "$RUNNER_TEMP/homeadmin.p12" \
            -passin env:APPLE_DISTRIBUTION_P12_PASSWORD -nodes \
            -out "$RUNNER_TEMP/homeadmin-import.pem"
          "$openssl3" pkcs12 -export -in "$RUNNER_TEMP/homeadmin-import.pem" \
            -passout env:APPLE_DISTRIBUTION_P12_PASSWORD \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 \
            -out "$RUNNER_TEMP/homeadmin-import.p12"
          keychain="$RUNNER_TEMP/homeadmin-signing.keychain-db"
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/homeadmin-import.p12" -k "$keychain" \
            -P "$APPLE_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/homeadmin-import.pem" "$RUNNER_TEMP/homeadmin-import.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"

      - name: Build and verify bundled customer assets
        run: |
          npm ci --prefix ..
          npm ci
          npm run sync -- ios

      - name: Validate profile and configure the app Release target
        run: |
          python ../scripts/prepare_apple_signing.py
          python - <<'PY'
          import hashlib, os, plistlib, re, subprocess
          from pathlib import Path
          temporary = Path(os.environ["RUNNER_TEMP"])
          profile = plistlib.loads(subprocess.check_output([
              "security", "cms", "-D", "-i", str(temporary / "homeadmin.mobileprovision")
          ], stderr=subprocess.DEVNULL))
          profile_name = profile.get("Name")
          if not isinstance(profile_name, str) or not profile_name.strip():
              raise SystemExit("Distribution profile has no usable name")
          profile_uuid = profile["UUID"]
          identities = subprocess.check_output([
              "security", "find-identity", "-v", "-p", "codesigning",
              str(temporary / "homeadmin-signing.keychain-db")
          ], text=True)
          available = set(re.findall(r"\b[0-9A-Fa-f]{40}\b", identities))
          available = {value.upper() for value in available}
          allowed = {hashlib.sha1(value).hexdigest().upper()
                     for value in profile.get("DeveloperCertificates", [])}
          matching = available & allowed
          print("Valid signing identities:", len(available))
          print("Profile certificates matching valid signing identities:", len(matching))
          if len(matching) != 1:
              raise SystemExit("Profile must include exactly one imported valid signing identity")
          identity = matching.pop()
          project = Path("ios/App/App.xcodeproj/project.pbxproj")
          tree = plistlib.loads(project.read_bytes())
          updated = 0
          for item in tree["objects"].values():
              settings = item.get("buildSettings", {})
              if (item.get("name") == "Release"
                      and settings.get("PRODUCT_BUNDLE_IDENTIFIER") == "uk.co.tenaciouspl.lifeadmin"):
                  settings.update(PROVISIONING_PROFILE_SPECIFIER=profile_name,
                                  PROVISIONING_PROFILE=profile_uuid,
                                  CODE_SIGN_IDENTITY=identity)
                  updated += 1
          assert updated == 1
          project.write_bytes(plistlib.dumps(tree))
          options_path = temporary / "ExportOptions.plist"
          options = plistlib.loads(options_path.read_bytes())
          options["signingCertificate"] = identity
          options["provisioningProfiles"]["uk.co.tenaciouspl.lifeadmin"] = profile_name
          options_path.write_bytes(plistlib.dumps(options))
          (temporary / "profile-uuid.txt").write_text(profile_uuid)
          print("Profile name and matching certificate selected for runner-only signing.")
          PY
          profile_uuid=$(cat "$RUNNER_TEMP/profile-uuid.txt")
          for profiles in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$profiles"
            cp "$RUNNER_TEMP/homeadmin.mobileprovision" "$profiles/$profile_uuid.mobileprovision"
          done

      - name: Archive and export signed IPA
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HomeAdmin.xcarchive" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/HomeAdmin.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/homeadmin-export"
          app="$RUNNER_TEMP/HomeAdmin.xcarchive/Products/Applications/App.app"
          codesign --verify --deep --strict "$app"
          python - <<'PY'
          import json, os, plistlib, subprocess, zipfile
          from pathlib import Path
          temporary = Path(os.environ["RUNNER_TEMP"])
          info = plistlib.loads((temporary / "HomeAdmin.xcarchive/Products/Applications/App.app/Info.plist").read_bytes())
          assert info["CFBundleIdentifier"] == "uk.co.tenaciouspl.lifeadmin"
          assert info["CFBundleDisplayName"] == "HomeAdmin"
          assert info["CFBundleVersion"] == str(int(os.environ["APPLE_BUILD_NUMBER"]))
          ipas = list((temporary / "homeadmin-export").glob("*.ipa"))
          assert len(ipas) == 1
          unpacked = temporary / "verify-export"
          zipfile.ZipFile(ipas[0]).extractall(unpacked)
          apps = list((unpacked / "Payload").glob("*.app"))
          assert len(apps) == 1
          subprocess.run(["codesign", "--verify", "--deep", "--strict", str(apps[0])], check=True)
          signed = plistlib.loads(subprocess.check_output([
              "codesign", "-d", "--entitlements", ":-", str(apps[0])
          ]))
          assert signed["application-identifier"] == "C8T85FCR6R.uk.co.tenaciouspl.lifeadmin"
          assert signed["com.apple.developer.team-identifier"] == "C8T85FCR6R"
          assert signed.get("get-task-allow", False) is False
          (temporary / "homeadmin-export/build-evidence.json").write_text(json.dumps({
              "source_commit": os.environ["GITHUB_SHA"], "build": info["CFBundleVersion"],
              "version": info["CFBundleShortVersionString"], "team": "C8T85FCR6R",
              "scope": "Signed build only; not uploaded, installed or accepted by Apple"
          }, indent=2) + "\n")
          PY

      - name: Retain signed build for review
        uses: actions/upload-artifact@v4
        with:
          name: homeadmin-signed-${{ github.sha }}-${{ inputs.build_number }}
          path: |
            ${{ runner.temp }}/homeadmin-export/*.ipa
            ${{ runner.temp }}/homeadmin-export/build-evidence.json
          retention-days: 7
          if-no-files-found: error

      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/homeadmin-signing.keychain-db" 2>/dev/null || true
          if test -f "$RUNNER_TEMP/profile-uuid.txt"; then
            profile_uuid=$(cat "$RUNNER_TEMP/profile-uuid.txt")
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision" \
              "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$profile_uuid.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/homeadmin.p12" "$RUNNER_TEMP/homeadmin.mobileprovision" \
            "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/profile-uuid.txt"
