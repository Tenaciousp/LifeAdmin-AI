name: HomeAdmin verified-build TestFlight upload

on:
  workflow_dispatch:
    inputs:
      action:
        description: Validate only, or validate and upload the verified version 1.0 build 2
        required: true
        type: choice
        default: validate
        options:
          - validate
          - upload
          - diagnose

permissions:
  contents: read
  actions: read

concurrency:
  group: homeadmin-apple-upload
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26-intel
    timeout-minutes: 30
    environment: apple-signing
    steps:
      - name: Require upload credentials and the successful signed build
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_UPLOAD_APPLE_ID: ${{ secrets.APPLE_UPLOAD_APPLE_ID }}
          APPLE_UPLOAD_APP_PASSWORD: ${{ secrets.APPLE_UPLOAD_APP_PASSWORD }}
          CHECK_MODE: ${{ inputs.action }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          for name in ('APPLE_UPLOAD_APPLE_ID', 'APPLE_UPLOAD_APP_PASSWORD'):
              if not os.environ.get(name, '').strip():
                  raise SystemExit('Missing protected environment secret: ' + name)
          if os.environ['CHECK_MODE'] == 'diagnose':
              username = os.environ['APPLE_UPLOAD_APPLE_ID']
              password = os.environ['APPLE_UPLOAD_APP_PASSWORD']
              email_ok = re.fullmatch(r"[^\s@]+@[^\s@]+\.[^\s@]+", username.strip()) is not None
              password_ok = re.fullmatch(r"(?:[a-zA-Z]{4}-){3}[a-zA-Z]{4}|[a-zA-Z]{16}", password.strip()) is not None
              print('Apple ID email format:', 'valid' if email_ok else 'invalid')
              print('Apple ID surrounding whitespace:', 'present' if username != username.strip() else 'absent')
              print('App-specific password format:', 'expected format' if password_ok else 'unexpected format')
              print('Password surrounding whitespace:', 'present' if password != password.strip() else 'absent')
              help_result = subprocess.run(['xcrun', 'altool', '--help'], capture_output=True, text=True)
              help_text = help_result.stdout + help_result.stderr
              for option in ('--validate-app', '-f', '--upload-app', '--password'):
                  print('Upload-tool option ' + option + ':', 'documented' if option in help_text else 'not listed')
              relevant = ('usage:', '--validate-app', '--upload-app', '--upload-package', '--type', '--platform', '--file', '--username', '--password', '--output-format', '--apple-id', '--provider-public-id', '--asc-public-id')
              for line in help_text.splitlines():
                  cleaned = line.strip()
                  if any(cleaned.lower().startswith(option) for option in relevant):
                      print('Local altool help:', cleaned[:700])
              print('Offline checks only; no Apple authentication attempted.')
              raise SystemExit(0)
          run = json.loads(subprocess.check_output([
              'gh', 'api', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/40487012427'
          ]))
          assert run['conclusion'] == 'success'
          assert run['head_sha'] == 'f2afdffda5639b702286e7f5b50b09bd94b7a393'
          assert run['path'] == '.github/workflows/apple-signing.yml'
          assert run['event'] == 'workflow_dispatch'
          print('Successful signed-build provenance verified.')
          PY

      - name: Download the existing signed build
        if: inputs.action != 'diagnose'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 12725593361
          merge-multiple: true
          run-id: 40487012427
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/signed-build

      - name: Verify the exact IPA before Apple receives the build
        if: inputs.action != 'diagnose'
        run: |
          python3 - <<'PY'
          import hashlib, json, os, plistlib, subprocess, zipfile
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          files = temporary / 'signed-build'
          evidence = json.loads((files / 'build-evidence.json').read_text())
          assert evidence['source_commit'] == 'f2afdffda5639b702286e7f5b50b09bd94b7a393'
          assert evidence['build'] == '2' and evidence['version'] == '1.0'
          assert evidence['team'] == 'C8T85FCR6R'
          ipas = list(files.glob('*.ipa'))
          assert len(ipas) == 1
          assert hashlib.sha256(ipas[0].read_bytes()).hexdigest() == '8aacaa1c5a60c99ec186c49a0e85e6ee6f56fb2cf2a275c6ec36d4010da51e0e'
          extracted = temporary / 'verify-upload'
          with zipfile.ZipFile(ipas[0]) as archive:
              for name in archive.namelist():
                  target = (extracted / name).resolve()
                  assert target.is_relative_to(extracted.resolve())
              archive.extractall(extracted)
          apps = list((extracted / 'Payload').glob('*.app'))
          assert len(apps) == 1
          info = plistlib.loads((apps[0] / 'Info.plist').read_bytes())
          assert info['CFBundleIdentifier'] == 'uk.co.tenaciouspl.lifeadmin'
          assert info['CFBundleVersion'] == '2' and info['CFBundleShortVersionString'] == '1.0'
          subprocess.run(['codesign', '--verify', '--deep', '--strict', str(apps[0])], check=True)
          signed = plistlib.loads(subprocess.check_output([
              'codesign', '-d', '--entitlements', ':-', str(apps[0])
          ]))
          assert signed['application-identifier'] == 'C8T85FCR6R.uk.co.tenaciouspl.lifeadmin'
          assert signed['com.apple.developer.team-identifier'] == 'C8T85FCR6R'
          assert signed.get('get-task-allow', False) is False
          print('Exact signed HomeAdmin version 1.0 build 2 verified.')
          PY

      - name: Validate with Apple and optionally upload for processing
        if: inputs.action != 'diagnose'
        env:
          UPLOAD_ACTION: ${{ inputs.action }}
          APPLE_UPLOAD_APPLE_ID: ${{ secrets.APPLE_UPLOAD_APPLE_ID }}
          APPLE_UPLOAD_APP_PASSWORD: ${{ secrets.APPLE_UPLOAD_APP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          action = os.environ['UPLOAD_ACTION']
          assert action in ('validate', 'upload')
          ipa = next((Path(os.environ['RUNNER_TEMP']) / 'signed-build').glob('*.ipa'))
          local_help = subprocess.run(['xcrun', 'altool', '--help'], capture_output=True, text=True)
          if '--app-password' not in local_help.stdout + local_help.stderr:
              raise SystemExit('This runner does not document the required upload authentication option; no Apple authentication attempted.')
          print('Documented current altool interface selected.')
          def execute(operation):
              result = subprocess.run([
                  'xcrun', 'altool', operation, str(ipa), '--platform', 'ios',
                  '--bundle-id', 'uk.co.tenaciouspl.lifeadmin',
                  '--bundle-version', '2', '--bundle-short-version-string', '1.0',
                  '--username', os.environ['APPLE_UPLOAD_APPLE_ID'],
                  '--app-password', '@env:APPLE_UPLOAD_APP_PASSWORD', '--output-format', 'json'
              ], capture_output=True, text=True)
              if result.returncode:
                  detail = (result.stdout + chr(10) + result.stderr).lower()
                  categories = {
                      'upload-tool option or command unsupported': ('unrecognized option', 'unknown option', 'no longer supported', 'invalid option', 'unsupported command', 'invalid parameter', 'missing required', 'required argument'),
                      'Apple upload authentication rejected': ('failed to authenticate', 'unable to authenticate', 'authentication failed', 'authentication error', 'incorrect password', 'invalid credentials', '-20101'),
                      'Apple provider selection required': ('multiple providers', 'provider-public-id is required', 'specify a provider'),
                      'Apple app-specific password required': ('-22938', 'sign in with the app-specific password', 'app-specific password is required', 'application-specific password is required', 'must use an app-specific password', 'app-specific password you entered is incorrect'),
                      'Apple app record unavailable or mismatched': ('no suitable application', 'application record', 'bundle identifier'),
                      'Apple agreement requires account-holder action': ('agreement', 'contract'),
                      'Apple service connection failure': ('timed out', 'network', 'connection refused', 'could not connect'),
                      'Apple binary validation rejected': ('asset validation failed', 'invalid binary', 'invalid signature'),
                  }
                  matched = [label for label, needles in categories.items() if any(value in detail for value in needles)]
                  for label in matched or ['Apple error not yet classified']:
                      print('Apple diagnostic category:', label)
                  markers = ('usage:', 'error:', 'password', 'credential', 'username', 'apple-id', 'provider', 'bundle', 'keychain', '@env:', 'required', 'requires', 'not found', 'no such file', 'not authorized', 'unauthorized', 'forbidden', 'invalid', 'unsupported', 'unrecognized', 'unable', 'cannot', 'failed', 'json', 'swift', 'exception', 'crash')
                  for marker in markers:
                      if marker in detail:
                          print('Fixed diagnostic marker:', marker)
                  known_codes = {'-22938', '-20101', '-1011', '-1012', '-19000', '-19209', '-1009', '-1200', '-1001', '-18000', '-1027', '-22421', '-22411'}
                  for code in sorted(known_codes):
                      if re.search(r'(?<![0-9])' + re.escape(code) + r'(?![0-9])', detail):
                          print('Recognized Apple diagnostic code:', code)
                  print('Upload tool exit status:', result.returncode)
                  raise SystemExit('Apple operation failed: ' + operation + '; no automatic retry performed.')
          execute('--validate-app')
          print('Apple validation succeeded.')
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          if action == 'upload':
              execute('--upload-package')
              print('Apple accepted the upload for processing. TestFlight availability is not yet confirmed.')
              summary.write_text('HomeAdmin 1.0 (2) upload accepted for Apple processing.\n\nSource: `f2afdffda5639b702286e7f5b50b09bd94b7a393`.\n\nNo tester invitations or App Store review submission performed.\n')
          else:
              summary.write_text('HomeAdmin 1.0 (2) passed Apple validation. No upload performed.\n')
          PY

      - name: Remove temporary build copies
        if: always()
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          for name in ('signed-build', 'verify-upload'):
              path = Path(os.environ['RUNNER_TEMP']) / name
              if path.is_dir():
                  shutil.rmtree(path)
          PY
