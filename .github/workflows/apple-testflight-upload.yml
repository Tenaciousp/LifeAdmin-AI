name: HomeAdmin verified-build TestFlight upload

on:
  workflow_dispatch:
    inputs:
      action:
        description: Validate only, validate and upload, or run offline diagnostics
        required: true
        type: choice
        default: validate
        options:
          - validate
          - upload
          - diagnose
      signed_run_id:
        description: Successful HomeAdmin manual signed-build run ID
        required: false
        type: string
      source_commit:
        description: Exact 40-character main commit signed by that run
        required: false
        type: string
      build_number:
        description: Version 1.0 build number in the signed artifact
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: homeadmin-apple-upload
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26-intel
    timeout-minutes: 30
    environment: apple-signing
    steps:
      - name: Check credentials and requested inputs
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_UPLOAD_APPLE_ID: ${{ secrets.APPLE_UPLOAD_APPLE_ID }}
          APPLE_UPLOAD_APP_PASSWORD: ${{ secrets.APPLE_UPLOAD_APP_PASSWORD }}
          CHECK_MODE: ${{ inputs.action }}
          SIGNED_RUN_ID: ${{ inputs.signed_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          for name in ('APPLE_UPLOAD_APPLE_ID', 'APPLE_UPLOAD_APP_PASSWORD'):
              if not os.environ.get(name, '').strip():
                  raise SystemExit('Missing protected environment secret: ' + name)
          if os.environ['CHECK_MODE'] == 'diagnose':
              result = subprocess.run(['xcrun', 'altool', '--help'], capture_output=True, text=True)
              help_text = result.stdout + result.stderr
              for option in ('--validate-app', '--upload-package', '--app-password'):
                  print('Local altool option ' + option + ':',
                        'documented' if option in help_text else 'not listed')
              print('Offline checks only; no Apple authentication attempted.')
              raise SystemExit(0)
          if not re.fullmatch(r'[0-9]+', os.environ.get('SIGNED_RUN_ID', '')):
              raise SystemExit('Provide the successful signed-build run ID.')
          if not re.fullmatch(r'[0-9a-fA-F]{40}', os.environ.get('SOURCE_COMMIT', '')):
              raise SystemExit('Provide the exact signed source commit.')
          build = os.environ.get('BUILD_NUMBER', '')
          if not re.fullmatch(r'[0-9]{1,4}', build) or int(build) < 1:
              raise SystemExit('Provide a valid unused Apple build number.')
          PY

      - name: Verify signed-build provenance and locate its artifact
        if: inputs.action != 'diagnose'
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_RUN_ID: ${{ inputs.signed_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['SIGNED_RUN_ID']
          source = os.environ['SOURCE_COMMIT'].lower()
          build = os.environ['BUILD_NUMBER']
          run = json.loads(subprocess.check_output(
              ['gh', 'api', f'repos/{repo}/actions/runs/{run_id}'], text=True))
          assert run.get('conclusion') == 'success', 'Signed build run did not succeed.'
          assert run.get('head_sha', '').lower() == source, 'Signed run source does not match.'
          assert run.get('path') == '.github/workflows/apple-signing.yml', 'Unexpected signing workflow.'
          assert run.get('event') == 'workflow_dispatch', 'Signed build was not manually dispatched.'
          assert run.get('head_branch') == 'main', 'Signed build did not run from main.'
          artifact_name = f'homeadmin-signed-{source}-{build}'
          data = json.loads(subprocess.check_output(
              ['gh', 'api', f'repos/{repo}/actions/runs/{run_id}/artifacts'], text=True))
          matches = [item for item in data.get('artifacts', [])
                     if item.get('name') == artifact_name and not item.get('expired')]
          assert len(matches) == 1, 'Expected one unexpired signed artifact.'
          artifact = matches[0]
          if not artifact.get('id') or not artifact.get('size_in_bytes'):
              raise SystemExit('Signed artifact metadata is incomplete.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('artifact_id=' + str(artifact['id']) + '\n')
          print('Successful signed-build source and exact artifact verified.')
          PY

      - name: Download the verified signed artifact
        if: inputs.action != 'diagnose'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.provenance.outputs.artifact_id }}
          run-id: ${{ inputs.signed_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/signed-build

      - name: Verify signed IPA identity and provenance
        if: inputs.action != 'diagnose'
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, plistlib, subprocess, zipfile
          from pathlib import Path
          files = Path(os.environ['RUNNER_TEMP']) / 'signed-build'
          evidence = json.loads((files / 'build-evidence.json').read_text())
          assert evidence.get('source_commit') == os.environ['SOURCE_COMMIT']
          assert evidence.get('build') == os.environ['BUILD_NUMBER']
          assert evidence.get('version') == '1.0'
          assert evidence.get('team') == 'C8T85FCR6R'
          ipas = list(files.glob('*.ipa'))
          assert len(ipas) == 1, 'Expected exactly one signed IPA.'
          ipa = ipas[0]
          extracted = Path(os.environ['RUNNER_TEMP']) / 'verify-upload'
          with zipfile.ZipFile(ipa) as archive:
              for name in archive.namelist():
                  target = (extracted / name).resolve()
                  assert target.is_relative_to(extracted.resolve()), 'Unsafe path in IPA archive.'
              archive.extractall(extracted)
          apps = list((extracted / 'Payload').glob('*.app'))
          assert len(apps) == 1, 'Expected exactly one iOS app.'
          app = apps[0]
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          assert info['CFBundleIdentifier'] == 'uk.co.tenaciouspl.lifeadmin'
          assert info['CFBundleVersion'] == os.environ['BUILD_NUMBER']
          assert info['CFBundleShortVersionString'] == '1.0'
          subprocess.run(['codesign', '--verify', '--deep', '--strict', str(app)], check=True)
          signed = plistlib.loads(subprocess.check_output([
              'codesign', '-d', '--entitlements', ':-', str(app)
          ]))
          assert signed['application-identifier'] == 'C8T85FCR6R.uk.co.tenaciouspl.lifeadmin'
          assert signed['com.apple.developer.team-identifier'] == 'C8T85FCR6R'
          assert signed.get('get-task-allow', False) is False
          print('Signed HomeAdmin 1.0 build verified.')
          print('IPA SHA-256:', hashlib.sha256(ipa.read_bytes()).hexdigest())
          PY

      - name: Validate with Apple, then upload only when selected
        if: inputs.action != 'diagnose'
        env:
          UPLOAD_ACTION: ${{ inputs.action }}
          APPLE_UPLOAD_APPLE_ID: ${{ secrets.APPLE_UPLOAD_APPLE_ID }}
          APPLE_UPLOAD_APP_PASSWORD: ${{ secrets.APPLE_UPLOAD_APP_PASSWORD }}
          SIGNED_RUN_ID: ${{ inputs.signed_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          action = os.environ['UPLOAD_ACTION']
          assert action in ('validate', 'upload')
          ipa = next((Path(os.environ['RUNNER_TEMP']) / 'signed-build').glob('*.ipa'))
          local_help = subprocess.run(['xcrun', 'altool', '--help'], capture_output=True, text=True)
          if '--app-password' not in local_help.stdout + local_help.stderr:
              raise SystemExit('Runner altool lacks the required password option; no Apple authentication attempted.')
          def execute(operation):
              result = subprocess.run([
                  'xcrun', 'altool', operation, str(ipa), '--platform', 'ios',
                  '--bundle-id', 'uk.co.tenaciouspl.lifeadmin',
                  '--bundle-version', os.environ['BUILD_NUMBER'],
                  '--bundle-short-version-string', '1.0',
                  '--username', os.environ['APPLE_UPLOAD_APPLE_ID'],
                  '--app-password', '@env:APPLE_UPLOAD_APP_PASSWORD',
                  '--output-format', 'json'
              ], capture_output=True, text=True)
              if result.returncode:
                  detail = (result.stdout + chr(10) + result.stderr).lower()
                  categories = {
                      'Apple upload authentication rejected': ('failed to authenticate', 'unable to authenticate', 'authentication failed', 'incorrect password', 'invalid credentials', '-20101'),
                      'Apple app-specific password required': ('-22938', 'sign in with the app-specific password', 'app-specific password is required', 'must use an app-specific password'),
                      'Apple provider selection required': ('multiple providers', 'provider-public-id is required', 'specify a provider'),
                      'Apple agreement requires account-holder action': ('agreement', 'contract'),
                      'Apple service connection failure': ('timed out', 'network', 'connection refused', 'could not connect'),
                      'Apple binary validation rejected': ('asset validation failed', 'invalid binary', 'invalid signature'),
                  }
                  matched = [label for label, needles in categories.items()
                             if any(value in detail for value in needles)]
                  for label in matched or ['Apple error not yet classified']:
                      print('Apple diagnostic category:', label)
                  print('Upload tool exit status:', result.returncode)
                  raise SystemExit('Apple operation failed: ' + operation + '; no automatic retry performed.')
          execute('--validate-app')
          print('Apple validation succeeded.')
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          if action == 'upload':
              execute('--upload-package')
              print('Apple accepted the upload for processing; TestFlight availability is not yet confirmed.')
              summary.write_text(
                  'HomeAdmin 1.0 (' + os.environ['BUILD_NUMBER'] +
                  ') accepted for Apple processing.\n\nSource: ' +
                  os.environ['SOURCE_COMMIT'] + '.\n\nSigned run: ' +
                  os.environ['SIGNED_RUN_ID'] +
                  '. No tester invitations or App Store review submission performed.\n')
          else:
              summary.write_text(
                  'HomeAdmin 1.0 (' + os.environ['BUILD_NUMBER'] +
                  ') passed Apple validation. No upload performed.\n')
          PY

      - name: Remove temporary build copies
        if: always()
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          for name in ('signed-build', 'verify-upload'):
              path = Path(os.environ['RUNNER_TEMP']) / name
              if path.is_dir():
                  shutil.rmtree(path)
          PY
