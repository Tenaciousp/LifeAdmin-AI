name: LifeAdmin AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifeadmin_build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run automated tests
        run: npm test

      - name: Run backup locking and HTTP integration tests
        run: |
          python -m unittest discover -s scripts -p test_backup_lock.py -v
          python -m unittest discover -s scripts -p test_backup_http_integration.py -v


      - name: Test encrypted backup and offline restore (synthetic only)
        run: |
          pip install 'cryptography>=45,<47'
          python -m unittest discover -s scripts -p test_secure_backup.py -v

      - name: Run type checks
        run: npm run typecheck

      - name: Smoke test API
        shell: bash
        run: |
          npm run dev:api > /tmp/lifeadmin-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          python scripts/smoke_api.py

      - name: Build production frontend
        run: npm run build:web

      - name: Build and verify local customer package
        run: |
          npm run build:local
          node scripts/verify_local_bundle.mjs

      - name: Check native scaffold configuration
        run: node native/scripts/verify-config.mjs

      - name: Set up native Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Android Java toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Synchronize Android development assets
        working-directory: lifeadmin_build/native
        run: |
          npm ci
          npm exec cap sync android

      - name: Compile Android development package
        working-directory: lifeadmin_build/native/android
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon
