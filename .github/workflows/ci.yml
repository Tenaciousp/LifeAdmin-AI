name: LifeAdmin AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifeadmin_build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run automated tests
        run: npm test

      - name: Run backup locking and HTTP integration tests
        run: |
          python -m unittest discover -s scripts -p test_backup_lock.py -v
          python -m unittest discover -s scripts -p test_backup_http_integration.py -v


      - name: Test encrypted backup and offline restore (synthetic only)
        run: |
          pip install 'cryptography>=45,<47'
          python -m unittest discover -s scripts -p test_secure_backup.py -v

      - name: Run type checks
        run: npm run typecheck

      - name: Smoke test API
        shell: bash
        run: |
          npm run dev:api > /tmp/lifeadmin-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          python scripts/smoke_api.py

      - name: Build production frontend
        run: npm run build:web

      - name: Build and verify local customer package
        run: |
          npm run build:local
          node scripts/verify_local_bundle.mjs

      - name: Check native scaffold configuration
        run: node native/scripts/verify-config.mjs

      - name: Set up native Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Android Java toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Synchronize Android development assets
        working-directory: lifeadmin_build/native
        run: |
          npm ci
          npm exec cap sync android

      - name: Compile Android development package
        working-directory: lifeadmin_build/native/android
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

      - name: Verify compiled Android customer package
        run: python scripts/verify_android_package.py

      - name: Save Android device-test package
        uses: actions/upload-artifact@v4
        with:
          name: lifeadmin-android-debug-${{ github.sha }}
          path: lifeadmin_build/native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Save native storage test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifeadmin-android-storage-tests-${{ github.sha }}
          path: |
            lifeadmin_build/native/android/app/build/test-results/testDebugUnitTest/
            lifeadmin_build/native/android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14


  verify-apple:
    name: Compile Apple simulator package
    # Standard hosted runners are free for public repositories; skip if that changes.
    if: ${{ github.event.repository.private == false }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: lifeadmin_build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up native Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Apple toolchain
        run: |
          xcodebuild -version
          python -c 'import subprocess; v=subprocess.check_output(["xcodebuild","-version"],text=True); assert int(v.splitlines()[0].split()[1].split(".")[0]) >= 26, "Xcode 26 or later required"'

      - name: Build and verify offline customer assets
        run: |
          npm ci
          npm run build:local
          node scripts/verify_local_bundle.mjs
          node native/scripts/verify-config.mjs

      - name: Synchronize Apple development assets
        working-directory: lifeadmin_build/native
        run: |
          npm ci
          npm exec cap sync ios

      - name: Compile unsigned Apple simulator package
        working-directory: lifeadmin_build/native
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-ios-simulator \
            -resultBundlePath build-ios-simulator.xcresult \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee apple-build.log

      - name: Check Apple startup and interactive persistence
        working-directory: lifeadmin_build/native
        run: python ../scripts/smoke_apple_simulator.py --ui-tests

      - name: Save Apple compilation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifeadmin-apple-compilation-${{ github.sha }}
          path: |
            lifeadmin_build/native/apple-ui-tests.xcresult/
            lifeadmin_build/native/apple-launch-evidence/
            lifeadmin_build/native/apple-build.log
            lifeadmin_build/native/build-ios-simulator.xcresult/
          if-no-files-found: warn
          retention-days: 14
